name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build universal + per-ABI release APKs
        run: |
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
          flutter build apk --release --split-per-abi --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/gigflow-v1.0.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/gigflow-v1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/gigflow-v1.0.0-armeabi-v7a.apk
          cd release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Verify INTERNET permission in release manifest
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump permissions release/gigflow-v1.0.0-universal.apk | tee perms.txt
          grep -q "android.permission.INTERNET" perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gigflow-apks
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            build/app/outputs/mapping/release/mapping.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GigFlow ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          files: |
            release/*.apk
            release/SHA256SUMS.txt

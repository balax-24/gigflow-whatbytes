name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    env:
      # Release signing is used only when the repo owner has added these
      # secrets; otherwise CI builds a debug-signed APK for verification only.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties
      - name: Build universal + per-ABI release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Package
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/gigflow-v${V}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/gigflow-v${V}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/gigflow-v${V}-armeabi-v7a.apk
          cd release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Verify INTERNET permission in release manifest
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump permissions release/gigflow-v${APP_VERSION}-universal.apk | tee perms.txt
          grep -q "android.permission.INTERNET" perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gigflow-apks
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            build/app/outputs/mapping/release/mapping.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GigFlow ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v${{ env.APP_VERSION }}.md
          files: |
            release/*.apk
            release/SHA256SUMS.txt
